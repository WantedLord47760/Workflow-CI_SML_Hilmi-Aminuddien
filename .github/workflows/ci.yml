name: CI - Heart Disease MLflow Project

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Trigger manual

jobs:
  train-model:
    name: Training + Upload Artefak + Docker Hub
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------ #
      # Step 1: Checkout kode
      # ------------------------------------------------------------------ #
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # Step 2: Setup Python
      # ------------------------------------------------------------------ #
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ------------------------------------------------------------------ #
      # Step 3: Install MLflow dan dependencies
      # ------------------------------------------------------------------ #
      - name: Install Dependencies
        run: |
          pip install mlflow==2.19.0 pandas scikit-learn numpy joblib

      # ------------------------------------------------------------------ #
      # Step 4: Jalankan MLflow Project
      # ------------------------------------------------------------------ #
      - name: Run MLflow Project
        run: |
          mlflow run MLProject/ \
            -P n_estimators=200 \
            -P max_depth=15 \
            --env-manager=local \
            --experiment-name "Heart-Disease-CI"

      # ------------------------------------------------------------------ #
      # Step 5: Debug - tampilkan struktur mlruns
      # ------------------------------------------------------------------ #
      - name: Debug mlruns structure
        run: |
          echo "=== Struktur mlruns ==="
          find mlruns -type f -name "*.yaml" | head -20
          echo ""
          echo "=== Daftar folder di mlruns ==="
          ls -la mlruns/

      # ------------------------------------------------------------------ #
      # Step 6: Upload artefak model ke GitHub (Actions artifact)
      # ------------------------------------------------------------------ #
      - name: Upload Model Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: heart-disease-model-${{ github.run_number }}
          path: mlruns/
          retention-days: 30

      # ------------------------------------------------------------------ #
      # Step 7: Cari model path & Build Docker Image
      # ------------------------------------------------------------------ #
      - name: Build Docker Image
        run: |
          # Gunakan Python untuk cari model path yang benar
          MODEL_PATH=$(python << 'EOF'
          import os, sys

          mlruns_dir = "mlruns"
          # Iterasi semua experiment folder (kecuali '0' = Default)
          for exp_id in sorted(os.listdir(mlruns_dir)):
              if exp_id == "0" or not os.path.isdir(os.path.join(mlruns_dir, exp_id)):
                  continue
              exp_path = os.path.join(mlruns_dir, exp_id)
              # Iterasi semua run di experiment ini
              for run_id in os.listdir(exp_path):
                  if run_id in ("meta.yaml", "datasets") or not os.path.isdir(os.path.join(exp_path, run_id)):
                      continue
                  artifact_model = os.path.join(exp_path, run_id, "artifacts", "model")
                  if os.path.exists(artifact_model):
                      print(f"{exp_id}/{run_id}")
                      sys.exit(0)
          # Fallback: cari di mana saja ada folder 'model' di artifacts
          for root, dirs, files in os.walk(mlruns_dir):
              if os.path.basename(root) == "model" and "MLmodel" in files:
                  parts = root.replace("mlruns/", "").split("/")
                  if len(parts) >= 3:
                      print(f"{parts[0]}/{parts[1]}")
                      sys.exit(0)
          EOF
          )
          echo "Found model at: mlruns/$MODEL_PATH/artifacts/model"
          # Build docker image
          mlflow models build-docker \
            -m "mlruns/$MODEL_PATH/artifacts/model" \
            -n "${{ secrets.DOCKER_USERNAME }}/heart-disease-model:latest" \
            --enable-mlserver

      # ------------------------------------------------------------------ #
      # Step 8: Login ke Docker Hub
      # ------------------------------------------------------------------ #
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ------------------------------------------------------------------ #
      # Step 9: Push Docker Image ke Docker Hub
      # ------------------------------------------------------------------ #
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/heart-disease-model:latest
          echo "Docker image berhasil di-push!"
          echo "https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/heart-disease-model" > MLProject/docker_hub_link.txt
          cat MLProject/docker_hub_link.txt

      # ------------------------------------------------------------------ #
      # Step 10: Commit docker_hub_link.txt ke repo
      # ------------------------------------------------------------------ #
      - name: Commit Docker Hub Link
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add MLProject/docker_hub_link.txt
          git diff --staged --quiet || git commit -m "ci: update docker hub link [run #${{ github.run_number }}]"
          git push
