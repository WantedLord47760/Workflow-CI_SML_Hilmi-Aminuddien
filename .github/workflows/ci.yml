name: CI - Heart Disease MLflow Project

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Trigger manual

jobs:
  train-model:
    name: Training + Upload Artefak + Docker Hub
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------ #
      # Step 1: Checkout kode
      # ------------------------------------------------------------------ #
      - name: Checkout Repository
        uses: actions/checkout@v3

      # ------------------------------------------------------------------ #
      # Step 2: Setup Python
      # ------------------------------------------------------------------ #
      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # ------------------------------------------------------------------ #
      # Step 3: Install Miniconda
      # ------------------------------------------------------------------ #
      - name: Install Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: '3.12'
          activate-environment: heart-disease-env

      # ------------------------------------------------------------------ #
      # Step 4: Install MLflow dan dependencies
      # ------------------------------------------------------------------ #
      - name: Install MLflow
        shell: bash -l {0}
        run: |
          pip install mlflow==2.19.0 pandas scikit-learn numpy joblib

      # ------------------------------------------------------------------ #
      # Step 5: Jalankan MLflow Project
      # ------------------------------------------------------------------ #
      - name: Run MLflow Project
        shell: bash -l {0}
        run: |
          mlflow run MLProject/ \
            -P n_estimators=200 \
            -P max_depth=15 \
            --env-manager=local \
            --experiment-name "Heart-Disease-CI"

      # ------------------------------------------------------------------ #
      # Step 6: Upload artefak model ke GitHub (sebagai Actions artifact)
      # ------------------------------------------------------------------ #
      - name: Upload Model Artifact to GitHub
        uses: actions/upload-artifact@v3
        with:
          name: heart-disease-model-${{ github.run_number }}
          path: mlruns/
          retention-days: 30

      # ------------------------------------------------------------------ #
      # Step 7: Build Docker Image menggunakan mlflow models build-docker
      # ------------------------------------------------------------------ #
      - name: Build Docker Image
        shell: bash -l {0}
        run: |
          # Ambil run_id terbaru dari mlruns
          RUN_ID=$(ls -t mlruns/0/ | grep -v 'meta.yaml' | head -1)
          echo "Run ID: $RUN_ID"
          # Build docker image dari model MLflow
          mlflow models build-docker \
            -m "mlruns/0/$RUN_ID/artifacts/model" \
            -n "${{ secrets.DOCKER_USERNAME }}/heart-disease-model:latest" \
            --enable-mlserver

      # ------------------------------------------------------------------ #
      # Step 8: Login ke Docker Hub
      # ------------------------------------------------------------------ #
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ------------------------------------------------------------------ #
      # Step 9: Push Docker Image ke Docker Hub
      # ------------------------------------------------------------------ #
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/heart-disease-model:latest
          echo "Docker image berhasil di-push ke:"
          echo "https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/heart-disease-model"
          # Simpan link Docker Hub
          echo "https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/heart-disease-model" > MLProject/docker_hub_link.txt
          cat MLProject/docker_hub_link.txt

      # ------------------------------------------------------------------ #
      # Step 10: Commit docker_hub_link.txt ke repo
      # ------------------------------------------------------------------ #
      - name: Commit Docker Hub Link
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add MLProject/docker_hub_link.txt
          git diff --staged --quiet || git commit -m "ci: update docker hub link [run #${{ github.run_number }}]"
          git push
